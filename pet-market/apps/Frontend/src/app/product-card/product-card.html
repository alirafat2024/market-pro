<div
  class=" p-2 card h-full overflow-hidden bg-base-100 shadow-lg transition-all duration-300 hover:-translate-y-2 hover:shadow-2xl"
>
  <figure class="relative h-56 overflow-hidden bg-base-200">
    <img
      [src]="product().image"
      [alt]="product().name"
      class="h-full w-full object-cover transition-transform duration-500 hover:scale-105"
    />
  </figure>

  <div class="card-body gap-3">
    <h2 class="card-title text-xl font-bold">
      {{ product().name }}
    </h2>

    <p class="line-clamp-2 text-sm leading-relaxed text-base-content/70">
      {{ product().description }}
    </p>

    <div class="mt-auto flex items-center justify-between gap-4 pt-4">
      <span class="text-2xl font-extrabold text-primary">
        ${{ product().price }}
      </span>

      <button
        (click)="onAddToCart(product())"
        class="btn btn-primary px-6 shadow-md transition-all hover:scale-105"
      >
        Add to Cart
      </button>
    </div>
  </div>
</div>
