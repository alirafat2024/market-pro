<div class="grid grid-cols-1 md:grid-cols-2 gap-10">

  <div class="space-y-6">
    <div>
      <h2 class="text-2xl font-bold tracking-tight">Order Summary</h2>
      <p class="text-sm text-base-content/50 mt-1">
        Review your items before payment
      </p>
    </div>

    @for (item of cartStore.items(); track item.id) {
      <div
        class="flex justify-between items-center gap-4 p-4 rounded-xl bg-base-200/50 border border-base-300 hover:border-primary/40 hover:bg-base-200 transition-all duration-200"
      >
        <div>
          <p class="font-semibold text-base">
            {{ item.name }}
          </p>

          <p class="text-sm text-base-content/50 mt-1">
            Quantity: {{ item.quantity }}
          </p>
        </div>

        <p class="font-bold text-base whitespace-nowrap">
          ${{ item.price * item.quantity }}
        </p>
      </div>
    }

    <div class="divider my-2"></div>

    <div
      class="flex justify-between items-center p-4 rounded-xl bg-primary/10 border border-primary/20"
    >
      <p class="font-semibold text-base">Total</p>
      <p class="text-2xl font-extrabold text-primary">
        ${{ cartStore.totalAmount() }}
      </p>
    </div>
  </div>

  <div class="space-y-6">
    <div>
      <h2 class="text-2xl font-bold tracking-tight">Payment</h2>
    </div>
    <button
      (click)="checkout()"
      class="btn btn-primary btn-lg w-full rounded-xl bg-blue-600 text-primary-content border border-primary p-2 m-2 shadow-lg shadow-primary/20 hover:shadow-xl hover:shadow-primary/30 hover:-translate-y-0.5 transition-all duration-200"
    >
      <span>Pay with Stripe</span>
    </button>

  </div>

</div>
